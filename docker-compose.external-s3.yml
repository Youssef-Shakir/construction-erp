# Overlay: use an EXISTING MinIO / S3 server instead of the bundled one.
#
# In .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.tunnel.yml:docker-compose.external-s3.yml
#   STORAGE_BACKEND=s3
#   S3_ENDPOINT_URL=https://apimedia.donialink.com
#   S3_BUCKET=...            S3_ACCESS_KEY=...   S3_SECRET_KEY=...
#   S3_REGION=us-east-1      S3_PREFIX=codia-erp   (folder inside a shared bucket)
# (the AWS_* names work too).
#
# The bundled minio / minio-init services are moved to a profile that is never
# started, so no MinIO container or volume is created on this server.
x-s3-env: &s3-env
  # Empty -> settings fall back to S3_ENDPOINT_URL from .env
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}

services:
  erp:
    environment: *s3-env
    depends_on: !override
      db:
        condition: service_healthy

  scans:
    environment: *s3-env

  test:
    environment: *s3-env
    depends_on: !override
      db:
        condition: service_healthy

  minio:
    profiles: !override ["bundled-minio"]

  minio-init:
    profiles: !override ["bundled-minio"]
