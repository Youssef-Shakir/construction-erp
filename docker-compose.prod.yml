# Production on the VPS (codia.donialink.com). In .env:  COMPOSE_FILE=docker-compose.prod.yml
#   docker compose up -d --build        (or scripts/update.sh)
#
# Ingress: the Cloudflare Tunnel container on the VPS (network "ilumina", 172.20.0.0/24,
# cloudflared at 172.20.0.5). In Cloudflare Zero Trust -> Tunnels -> Public hostnames:
#   codia.donialink.com  ->  HTTP  ->  172.20.0.20:8000
# Files go to the existing MinIO (S3_* in .env); no MinIO runs here.
# The database stays on this project's own network, out of reach of the other stacks.
name: construction-erp

services:
  db:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  erp:
    build:
      context: .
      target: production
    image: construction-erp:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      RUN_MIGRATIONS: "1"
      # HTTPS ends at Cloudflare ("Always Use HTTPS"); the tunnel speaks plain HTTP to us
      SECURE_SSL_REDIRECT: "False"
      SECURE_COOKIES: "True"
      FORWARDED_ALLOW_IPS: 172.20.0.5     # trust X-Forwarded-* only from cloudflared
    networks:
      default:
      ilumina:
        ipv4_address: 172.20.0.20
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/app:uid=1001,gid=1001,mode=0700
    deploy:
      resources:
        limits:
          memory: 768m

networks:
  ilumina:
    external: true  # the Cloudflare Tunnel's network, created by the Ilumina stack

volumes:
  pgdata:
